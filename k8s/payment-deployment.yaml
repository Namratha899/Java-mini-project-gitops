apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-app
  template:
    metadata:
      labels:
        app: payment-app
    spec:
      containers:
        - name: payment-app
          image: 547451919785.dkr.ecr.us-east-1.amazonaws.com/dev/docker:1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
